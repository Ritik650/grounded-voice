name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Lint
        run: ruff check app eval tests scripts

      - name: Format check
        run: ruff format --check app eval tests scripts

      # Models are ~270 MB and change only when a version is pinned, so a cache hit
      # takes this from minutes to seconds on most runs.
      - name: Cache models
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            models
            ~/.cache/huggingface
            /tmp/fastembed_cache
          key: models-v1-${{ hashFiles('requirements.txt', 'scripts/download_models.py') }}

      - name: Download models
        run: |
          python scripts/download_models.py
          python -c "from faster_whisper import WhisperModel; WhisperModel('base.en', device='cpu', compute_type='int8')"

      - name: Run tests
        run: pytest tests/ -v --durations=10

      # Regression gate, not an accuracy claim: Piper speaks the KB and Whisper
      # transcribes it back. Synthetic speech is unrealistically clean, so the bar is
      # tight -- crossing it means something broke in the audio path, not that
      # accuracy drifted. The real accuracy number comes from the LibriSpeech job.
      - name: WER regression gate
        run: python -m eval.wer_eval --dataset synthetic --limit 20 --max-wer 0.12

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: voice-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name va -p 8000:8000 voice-assistant:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "healthy after ${i}0s"
              curl -s http://localhost:8000/health
              docker rm -f va
              exit 0
            fi
            sleep 10
          done
          echo "container never became healthy"
          docker logs va
          docker rm -f va
          exit 1
