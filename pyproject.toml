[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI's File()/Depends() defaults are the documented idiom
    "E501",  # long lines are caught by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path is set up in conftest before app imports
"eval/*" = ["E402"]   # same, for standalone script entry points

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
